name: Project Integrity

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Unity repository
        shell: pwsh
        run: ./Tools/Validate-Repository.ps1
